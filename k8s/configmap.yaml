apiVersion: v1
kind: ConfigMap

metadata:
  name: billing-api-config
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-api
    app.kubernetes.io/part-of: billing-app

data:
  APP_ENV: production
  APP_PORT: "8080"
  GIN_MODE: release
  DB_HOST: host.docker.internal
  DB_PORT: "3306"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: 5m
  SERVER_SHUTDOWN_TIMEOUT: 15s
  # Google sign-in. Non-secret values only; GOOGLE_CLIENT_SECRET and SESSION_SECRET come
  # from billing-db-secret. The redirect URL must be registered in Google Cloud Console.
  GOOGLE_CLIENT_ID: change-me.apps.googleusercontent.com
  GOOGLE_REDIRECT_URL: https://billing.example.com/api/v1/auth/google/callback
  SESSION_TTL: 12h
  # Who may sign in is the authorized_users table in MySQL (`make authorize EMAIL=...`).
