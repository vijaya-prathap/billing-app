apiVersion: apps/v1
kind: Deployment

metadata:
  name: billing-api
  namespace: billing
  labels:
    app: billing-api
    app.kubernetes.io/name: billing-api
    app.kubernetes.io/part-of: billing-app

spec:
  replicas: 2
  revisionHistoryLimit: 5

  # Selector is immutable on an existing Deployment; keep it unchanged.
  selector:
    matchLabels:
      app: billing-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: billing-api
        app.kubernetes.io/name: billing-api
        app.kubernetes.io/part-of: billing-app

    spec:
      # Longer than SERVER_SHUTDOWN_TIMEOUT so in-flight requests drain before SIGKILL.
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: billing-api
          image: ghcr.io/vijaya-prathap/billing-api:sha-b58e3fc7a63000c5e3b6e8c2aec0bbd1db6a81bf
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: billing-api-config
            - secretRef:
                name: billing-db-secret

          # The API retries the DB connection for up to ~75s before listening.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
