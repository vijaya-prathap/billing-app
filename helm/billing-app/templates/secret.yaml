{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
type: Opaque
stringData:
  DB_USER: {{ required "secret.data.DB_USER is required when secret.create=true" .Values.secret.data.DB_USER | quote }}
  DB_PASSWORD: {{ required "secret.data.DB_PASSWORD is required when secret.create=true" .Values.secret.data.DB_PASSWORD | quote }}
  DB_NAME: {{ required "secret.data.DB_NAME is required when secret.create=true" .Values.secret.data.DB_NAME | quote }}
{{- end }}
