name: CD

on:
  # Publish only after CI has passed for a push to main.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            image: billing-api
          - context: frontend
            image: billing-frontend
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${REGISTRY}/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ env.COMMIT_SHA }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Kubernetes
    needs: publish
    # Opt-in: set repository variable DEPLOY_ENABLED=true and secret KUBE_CONFIG (base64 kubeconfig).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Helm upgrade
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          helm upgrade --install billing-app helm/billing-app \
            --namespace billing --create-namespace \
            --set image.repository="${REGISTRY}/${OWNER,,}/billing-api" \
            --set image.tag="sha-${COMMIT_SHA}" \
            --atomic --wait --timeout 5m
