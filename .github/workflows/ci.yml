name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build Docker image
        run: docker build -t billing-api:ci .

  migrations:
    name: Migrations (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: billing_db
          MYSQL_USER: billing_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      MYSQL_PWD: ci_password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply migrations twice and seed (verifies idempotency)
        run: |
          for pass in 1 2; do
            for f in backend/migrations/*.sql; do
              echo "pass $pass: $f"
              mysql -h 127.0.0.1 -ubilling_user billing_db < "$f"
            done
          done
          mysql -h 127.0.0.1 -ubilling_user billing_db < database/seed/seed.sql
          mysql -h 127.0.0.1 -ubilling_user billing_db -e "SHOW TABLES; SELECT COUNT(*) AS invoices FROM invoices;"

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Build Docker image
        run: docker build -t billing-frontend:ci .

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/billing-app

      - name: Render templates
        run: helm template billing-app helm/billing-app --namespace billing > /dev/null
